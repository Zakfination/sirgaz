name: CI

on:
  push:
    branches: [main, hardening/p0-security]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
        run: yarn build
      - name: Start production server
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          PORT: 3000
        run: |
          yarn start > /tmp/sirgaz-next.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
      - name: Security smoke tests
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/match)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/mission)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/reward)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/reward/redeem)" = "401"
          headers="$(curl -sSI http://127.0.0.1:3000/)"
          echo "$headers" | grep -qi 'x-content-type-options: nosniff'
          echo "$headers" | grep -qi 'referrer-policy: strict-origin-when-cross-origin'
          echo "$headers" | grep -qi 'content-security-policy:'
          if echo "$headers" | grep -qi 'access-control-allow-origin: \*'; then exit 1; fi
